name: CRC50 temporary download
on:
  push:
    branches: ['temp/crc50-download-20260918']
    paths: ['.github/workflows/crc50-download.yml', 'crc50/**']
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install validation and encryption dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf cryptography
      - name: Retrieve targeted originals and preserve source versions
        run: python -u crc50/supplement.py
      - name: Upload encrypted temporary bundle
        uses: actions/upload-artifact@v4
        with:
          name: CRC50-encrypted-supplement
          path: encrypted_artifact/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
