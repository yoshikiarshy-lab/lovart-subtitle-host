name: CRC50 additional public fulltext
on:
  push:
    branches: ['temp/crc50-download-20260918']
    paths: ['.github/workflows/crc50-deep.yml']
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser and PDF validation
        run: |
          python -m pip install -q requests pypdf cryptography beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Retrieve public files using standard browser
        run: python crc50/browser_public.py
      - name: Upload encrypted retrieval result
        uses: actions/upload-artifact@v4
        with:
          name: CRC50-browser-encrypted
          path: deep_artifact/
          retention-days: 1
          if-no-files-found: error
