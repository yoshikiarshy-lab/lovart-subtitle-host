name: CRC50 public repository follow-up
on:
  push:
    branches: ['temp/crc50-download-20260918']
    paths: ['.github/workflows/crc50-repository-v3.yml']
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install validators
        run: python -m pip install -q requests pypdf beautifulsoup4 cryptography
      - name: Read public repository sources
        run: python crc50/targeted_repository_v3.py
      - name: Store encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: CRC50-targeted-v3-encrypted
          path: repository_v3_artifact/
          retention-days: 1
          if-no-files-found: error
